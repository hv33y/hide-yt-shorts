name: Auto Update Filter List

on:
  schedule:
    - cron: '0 8 */3 * *' # every 3 days at 08:00 UTC
  workflow_dispatch: # manual button
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version header
        run: |
          DATE=$(date -u +"%Y.%m.%d")
          DATETIME=$(date -u +"%Y-%m-%d %H:%M")
          echo "Updating to version $DATE"
          
          # If list.txt exists, update headers, otherwise skip
          if [ -f list.txt ]; then
            sed -i "s/^! Version:.*/! Version: $DATE/" list.txt
            sed -i "s/^! Last modified:.*/! Last modified: $DATETIME/" list.txt
            cat list.txt | head -15
          else
            echo "list.txt not found - nothing to update"
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update filter list $(date -u +%Y.%m.%d)"
          git push
