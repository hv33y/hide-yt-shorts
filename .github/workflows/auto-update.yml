name: Auto Update Filter List

on:
  schedule:
    - cron: '0 8 */3 * *' # every 3 days at 08:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version header
        run: |
          DATE=$(date -u +"%Y.%m.%d")
          DATETIME=$(date -u +"%Y-%m-%d %H:%M")
          echo "Bumping to $DATE"
          
          # Only update Version + Last modified - DO NOT touch Title/Description/Homepage
          if [ -f list.txt ]; then
            sed -i "s/^! Version:.*/! Version: $DATE/" list.txt
            sed -i "s/^! Last modified:.*/! Last modified: $DATETIME/" list.txt
            # Ensure no Expires line comes back
            sed -i "/^! Expires:/d" list.txt
            head -10 list.txt
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update $DATE" && git push)
